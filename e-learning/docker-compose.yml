services:
  couchdb:
    image: couchdb:3.3
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=password
    ports:
      - "5984:5984"
    volumes:
      - couchdb_data:/opt/couchdb/data

  auth-service:
    build: ./auth-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - ACCESS_TOKEN_SECRET=your-access-token-secret
      - REFRESH_TOKEN_SECRET=your-refresh-token-secret
      - NODE_ENV=development
    depends_on:
      - couchdb

  content-service:
    build: ./content-service
    ports:
      - "3002:3002"
    environment:
      - PORT=3002
      - NODE_ENV=development
    depends_on:
      - couchdb

  bff:
    build: ./bff
    ports:
      - "3003:3003"
    environment:
      - PORT=3003
      - AUTH_SERVICE_URL=http://auth-service:3001
      - CONTENT_SERVICE_URL=http://content-service:3002
      - NODE_ENV=development
    depends_on:
      - auth-service
      - content-service

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3003
      - NODE_ENV=development
    depends_on:
      - bff

volumes:
  couchdb_data:
